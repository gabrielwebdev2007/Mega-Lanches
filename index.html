<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Vendas</title>
  <style>
  body { 
    font-family: 'Segoe UI', Arial, sans-serif; 
    background: linear-gradient(135deg, #007bff, #00c6ff); 
    margin: 0; 
    padding: 20px; 
    color: #333;
  }
  .container { 
    max-width: 500px; 
    margin: auto; 
    background: #f9f9f9; /* Cinza claro em vez de branco */
    padding: 20px; 
    border-radius: 16px; 
    box-shadow: 0 4px 20px rgba(0,0,0,0.2); 
  }
  h2 { 
    text-align: center; 
    font-size: 1.6em; 
    color: #007bff; 
    margin-bottom: 15px;
  }
  input, button { 
    width: 100%; 
    padding: 14px; 
    margin-bottom: 12px; 
    border-radius: 10px; 
    border: 1px solid #ddd; 
    font-size: 1em;
  }
  input:focus { outline: none; border-color: #007bff; box-shadow: 0 0 5px #007bff; }
  button { 
    background: #007bff; 
    color: white; 
    border: none; 
    cursor: pointer; 
    font-weight: bold;
    transition: transform 0.2s, background 0.3s; 
  }
  button:hover { background: #0056b3; transform: scale(1.03); }

  /* Cartões coloridos */
  .card-dia { 
    background: #e6f0ff; /* Azul suave */
    padding: 15px; 
    border-radius: 12px; 
    margin-bottom: 10px; 
    text-align: center; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .card-mes { 
    background: #e8f5e9; /* Verde claro */
    padding: 15px; 
    border-radius: 12px; 
    margin-bottom: 15px; 
    text-align: center; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .card strong { color: #007bff; }

  table { 
    width: 100%; 
    border-collapse: collapse; 
    margin-top: 15px; 
    font-size: 0.9em;
    border-radius: 10px;
    overflow: hidden;
  }
  th, td { 
    border: 1px solid #eee; 
    padding: 10px; 
    text-align: center; 
  }
  th { background: #007bff; color: white; }
  .acoes { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .acoes button { 
    width: auto; 
    padding: 6px 12px; 
    font-size: 0.85em; 
    border-radius: 8px;
  }
  .mensagem { text-align: center; font-weight: bold; color: green; margin-bottom: 10px; }

  /* Responsividade estilo app */
  @media (max-width: 480px) {
    .container { padding: 15px; }
    h2 { font-size: 1.3em; }
    input, button { font-size: 1em; padding: 12px; }
    table, th, td { font-size: 0.8em; }
    .acoes { flex-direction: column; }
    .acoes button { width: 100%; }
  }
</style>

</head>
<body>
<div class="container">
  <h2>📊 Sistema de Vendas</h2>
  <p id="mensagem" class="mensagem"></p>
  
  <input type="number" step="0.01" id="valor" placeholder="💰 Valor da Venda (R$)" required>
  <input type="date" id="data" max="2035-12-31">
  <button onclick="registrarVenda()">➕ Registrar Venda</button>

  <div class="card">
    <p><strong>Hoje:</strong> R$ <span id="totalDia">0,00</span></p>
    <p><strong>Mês:</strong> R$ <span id="totalMes">0,00</span></p>
  </div>

  <label for="mesFiltro"><strong>📅 Escolha o mês:</strong></label>
  <input type="month" id="mesFiltro" max="2035-12" onchange="atualizarRelatorio()">

  <h3 style="text-align:center; color:#007bff;">📑 Vendas do mês</h3>
  <table id="tabelaVendas">
    <tr>
      <th>#</th>
      <th>Data</th>
      <th>Valor (R$)</th>
      <th>Ações</th>
    </tr>
  </table>
</div>

<script>
  let vendas = JSON.parse(localStorage.getItem("vendas")) || [];

  function registrarVenda() {
    const valor = parseFloat(document.getElementById("valor").value);
    const data = document.getElementById("data").value || new Date().toISOString().split("T")[0];
    if (isNaN(valor) || valor <= 0) {
      alert("Digite um valor válido!");
      return;
    }
    vendas.push({ data: data, valor: valor });
    localStorage.setItem("vendas", JSON.stringify(vendas));
    document.getElementById("mensagem").innerText = "✅ Venda registrada!";
    atualizarRelatorio();
    document.getElementById("valor").value = "";
    document.getElementById("data").value = "";
  }

  function editarVenda(indice) {
    const novoValor = prompt("Digite o novo valor:", vendas[indice].valor);
    const novaData = prompt("Digite a nova data (AAAA-MM-DD):", vendas[indice].data);
    if (novoValor && novaData) {
      vendas[indice].valor = parseFloat(novoValor);
      vendas[indice].data = novaData;
      localStorage.setItem("vendas", JSON.stringify(vendas));
      atualizarRelatorio();
      alert("✏️ Venda atualizada!");
    }
  }

  function removerVenda(indice) {
    if (confirm("Tem certeza que deseja remover esta venda?")) {
      vendas.splice(indice, 1);
      localStorage.setItem("vendas", JSON.stringify(vendas));
      atualizarRelatorio();
      alert("🗑️ Venda removida!");
    }
  }

  function atualizarRelatorio() {
    const hoje = new Date().toISOString().split("T")[0];
    const filtro = document.getElementById("mesFiltro").value;
    let mesAtual, anoAtual;
    if (filtro) {
      const partes = filtro.split("-");
      anoAtual = parseInt(partes[0]);
      mesAtual = parseInt(partes[1]);
    } else {
      mesAtual = new Date().getMonth() + 1;
      anoAtual = new Date().getFullYear();
    }

    let totalDia = 0;
    let totalMes = 0;

    const tabela = document.getElementById("tabelaVendas");
    tabela.innerHTML = "<tr><th>#</th><th>Data</th><th>Valor (R$)</th><th>Ações</th></tr>";

    vendas.forEach((venda, i) => {
      const dataVenda = new Date(venda.data);
      const mesVenda = dataVenda.getMonth() + 1;
      const anoVenda = dataVenda.getFullYear();

      if (venda.data === hoje) totalDia += venda.valor;
      if (mesVenda === mesAtual && anoVenda === anoAtual) {
        totalMes += venda.valor;
        tabela.innerHTML += `
          <tr>
            <td>${i+1}</td>
            <td>${venda.data}</td>
            <td>R$ ${venda.valor.toFixed(2).replace(".", ",")}</td>
            <td class="acoes">
              <button onclick="editarVenda(${i})">✏️ Editar</button>
              <button onclick="removerVenda(${i})">🗑️ Remover</button>
            </td>
          </tr>`;
      }
    });

    document.getElementById("totalDia").innerText = totalDia.toFixed(2).replace(".", ",");
    document.getElementById("totalMes").innerText = totalMes.toFixed(2).replace(".", ",");
  }

  atualizarRelatorio();
</script>
</body>
</html>
